# Onderwerpen voor lezingen en colleges. Voorstel: pas titels en teksten naar eigen smaak aan.
publiek_en: "For managers, HR professionals, executives and students. As a keynote, workshop or lecture."
publiek: "Voor leidinggevenden, HR-professionals, bestuurders en studenten. Als keynote, workshop of college."

onderwerpen:
  - titel: "Vragen we te veel van werknemers? Of bieden we te weinig?"
    tekst: "De reflex bij werkstress is om de werkdruk omlaag te brengen. Maar de werkdruk is de afgelopen jaren eerder gedaald dan gestegen, terwijl psychische klachten en uitval flink zijn toegenomen. Er is iets anders aan de hand. Misschien sturen we op de verkeerde dingen. Dat verkennen we in dit college, deze lezing of workshop."
    titel_en: "Do we ask too much of employees? Or offer too little?"
    tekst_en: "The reflex when work stress rises is to reduce workload. Yet workload has decreased rather than increased in recent years, while mental health complaints and sickness absence have risen sharply. Something else is going on. Perhaps we are steering on the wrong things. That is what we explore in this lecture, talk or workshop."
  - titel: "Stop met motiveren!"
    tekst: "Leiderschap gaat niet over motiveren, maar over een werkomgeving waarin mensen kunnen zeggen: ‘Hier kan ik me ontwikkelen en mijn talent en energie kwijt. Ik ben zinvol bezig, voeg iets van waarde toe, en dat wordt gezien en gewaardeerd.’ Stop met motiveren en ga op zoek naar wat mensen drijft."
    titel_en: "Stop motivating!"
    tekst_en: "Leadership is not about motivating, but about a work environment in which people can say: ‘Here I can develop and put my talent and energy to use. My work is meaningful, I add something of value, and that is seen and appreciated.’ Stop motivating and find out what drives people."
  - titel: "Thuiswerken en betekenisgeving"
    tekst: "De waarde van werk voor mensen is over de hele linie toegenomen, maar bij hybride werken gebeurt er iets bijzonders: hoe meer mensen thuiswerken, hoe zwaarder betekenisvol werk weegt. Zowel voor de energie die ze uit hun werk halen als voor de vraag of ze willen blijven of weggaan."
    titel_en: "Working from home and meaning"
    tekst_en: "The value of work has grown across the board, but something special happens with hybrid work: the more people work from home, the more meaningful work matters. Both for the energy they draw from their work and for whether they want to stay or leave."
  - titel: "De wil tot betekenis"
    tekst: "Over wat ons drijft in werk en leven, en hoe zich dat vertaalt in doelen, waarden en zingeving, voor jou en voor organisaties. Met Viktor Frankl als vertrekpunt: betekenis vind je niet door geluk of succes na te jagen, maar door ergens aan bij te dragen. Wat vraagt dat van hoe we werk inrichten, en van een purpose en waarden die mensen echt raken?"
    titel_en: "The will to meaning"
    tekst_en: "About what drives us in work and life, and how that translates into goals, values and meaning, for you and for organizations. Taking Viktor Frankl as a starting point: you do not find meaning by chasing happiness or success, but by contributing to something. What does that ask of how we design work, and of a purpose and values that truly resonate with people?"
