# Onderwerpen voor lezingen en colleges. Voorstel: pas titels en teksten naar eigen smaak aan.
publiek: "Voor leidinggevenden, HR-professionals, bestuurders en studenten. Als keynote, workshop of college."

onderwerpen:
  - titel: "We meten werkdruk, maar vergeten wat mensen gezond houdt"
    tekst: "Waarom energiebronnen in het werk minstens zo belangrijk zijn als het terugdringen van werkdruk, en hoe je daarop stuurt."
  - titel: "Stop met motiveren!"
    tekst: "Wat leidinggevenden wél kunnen doen: ruimte geven voor autonomie, competentie en verbondenheid."
  - titel: "Thuiswerken en betekenis"
    tekst: "Hoe hybride werken verandert wat ons motiveert, en waarom het werk zelf dan meer moet betekenen."
  - titel: "De wil tot betekenis"
    tekst: "Over doel, waarden en zingeving in organisaties, met Viktor Frankl als vertrekpunt."
